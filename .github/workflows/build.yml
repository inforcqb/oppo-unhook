name: Build oppo_unhook

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            api: 26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          NDK_VER="27.0.12077973"
          NDK_ZIP="android-ndk-r27-linux.zip"
          curl -sL "https://dl.google.com/android/repository/${NDK_ZIP}" -o ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r27 ndk
          echo "ANDROID_NDK_HOME=${PWD}/ndk" >> $GITHUB_ENV

      - name: Setup CMake & Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-26" \
            -DANDROID_STL="none"

      - name: Build
        run: cmake --build build

      - name: Show binary info
        run: |
          file build/oppo_unhook
          ls -lh build/oppo_unhook

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oppo_unhook-arm64
          path: build/oppo_unhook
