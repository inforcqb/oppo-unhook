name: Build oppo-unhook (eBPF + loader)

on:
  push:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target ABI'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
      platform:
        description: 'Android API level (ex: android-35)'
        required: true
        default: 'android-35'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 1: Build BPF program (clang -target bpf) ──────────
      - name: Build BPF program
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm
          clang -target bpf -O2 -g \
            -I bpf/ \
            -c bpf/unhook.bpf.c \
            -o unhook.bpf.o
          ls -lh unhook.bpf.o
          file unhook.bpf.o

      # ── Step 2: Select NDK ────────────────────────────────────
      - name: Select NDK version for target API level
        id: select-ndk
        shell: bash
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'android-35' }}"
          API_LEVEL="${PLATFORM#android-}"
          echo "Target API level: $API_LEVEL"

          if [ "$API_LEVEL" -le 35 ]; then
            NDK_URL="https://dl.google.com/android/repository/android-ndk-r29-linux.zip"
            NDK_DIR="android-ndk-r29"
          else
            echo "::error::API level $API_LEVEL not supported by available NDK."
            exit 1
          fi

          echo "NDK_URL=$NDK_URL" >> "$GITHUB_ENV"
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Download and extract NDK
        run: |
          wget -q "$NDK_URL" -O ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      # ── Step 3: Build Android loader ──────────────────────────
      - name: Build loader with CMake
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=${{ github.event.inputs.abi || 'arm64-v8a' }} \
                -DANDROID_PLATFORM=${{ github.event.inputs.platform || 'android-35' }}
          cmake --build build

      - name: Show artifacts
        run: |
          file build/oppo_unhook
          ls -lh build/oppo_unhook
          ls -lh unhook.bpf.o

      # ── Step 4: Upload ────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oppo-unhook-${{ github.event.inputs.abi || 'arm64-v8a' }}
          path: |
            build/oppo_unhook
            unhook.bpf.o
